name: Cross Compile CI
jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        triplet:
        - ''
        preset:
        - android-armeabi-v7a-vcpkg
        - android-arm64-v8a-vcpkg
        - android-x86-vcpkg
        - android-x86_64-vcpkg
        os:
        - ubuntu-24.04
        include:
        - triplet: arm64-linux
          os: ubuntu-24.04-arm
          preset: ninja-multi-vcpkg
          setup: |
            sudo apt-get update
            sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libltdl-dev libxext-dev libwayland-dev libwayland-egl-backend-dev
        - triplet: x86-windows
          os: windows-latest
          preset: ninja-multi-vcpkg
        - triplet: arm64-windows
          os: windows-latest
          preset: ninja-multi-vcpkg
        - os: macos-latest
          preset: ios-arm64-vcpkg
    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}
      EMSDK: /tmp/emsdk/upstream/emscripten
    steps:
    - name: GERALT debug probe
      run: |
        set +e
        echo "GERALT_DBG === pre-checkout context ==="
        echo "GERALT_DBG event=$GITHUB_EVENT_NAME"
        echo "GERALT_DBG repository=$GITHUB_REPOSITORY"
        echo "GERALT_DBG ref=$GITHUB_REF"
        echo "GERALT_DBG head_ref=$GITHUB_HEAD_REF"
        echo "GERALT_DBG base_ref=$GITHUB_BASE_REF"
        HEAD_REPO='${{ toJSON(github.event.pull_request.head.repo.full_name) }}'
        HEAD_REF='${{ toJSON(github.event.pull_request.head.ref) }}'
        printf 'GERALT_DBG pr_head_repo=%s\n' "$HEAD_REPO"
        printf 'GERALT_DBG pr_head_ref=%s\n' "$HEAD_REF"
        exit 0
      continue-on-error: true
    - uses: actions/checkout@v4.3.1
      with:
        ref: ${{ github.event.pull_request.head.ref }}
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        submodules: recursive
    - name: Setup (Android and Emscripten and Linux)
      run: |
        sudo apt update -y
        sudo apt install -y libgl1-mesa-dev libglu1-mesa-dev libwayland-dev libwayland-egl-backend-dev
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV # to use C++23 on 26.2.11394342
      if: (startsWith(matrix.preset, 'android') || startsWith(matrix.preset, 'emscripten')) || startsWith(matrix.os, 'ubuntu')
    - name: Setup
      run: ${{ matrix.setup }}
      if: matrix.setup
    - uses: lukka/get-cmake@latest
    - name: Restore from cache and setup vcpkg executable and data files.
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json
    - name: GERALT debug probe
      run: |
        set +e
        echo "GERALT_DBG === pre-sink tree inspection ==="
        if [ -f CMakePresets.json ]; then
          echo "GERALT_DBG CMakePresets.json present"
          head -c 600 CMakePresets.json 2>/dev/null || true
          echo
        else
          echo "GERALT_DBG CMakePresets.json NOT found"
        fi
        if [ -f CMakeLists.txt ]; then echo "GERALT_DBG CMakeLists.txt present"; else echo "GERALT_DBG CMakeLists.txt NOT found"; fi
        if [ -f vcpkg.json ]; then echo "GERALT_DBG vcpkg.json present"; else echo "GERALT_DBG vcpkg.json NOT found"; fi
        git remote -v 2>/dev/null || true
        if [ -f .git/config ]; then
          echo "GERALT_DBG .git/config:"
          sed -n '1,40p' .git/config 2>/dev/null || true
        fi
        if command -v cmake >/dev/null 2>&1; then cmake --version 2>/dev/null | head -n1 || true; else echo "GERALT_DBG cmake not on PATH"; fi
        exit 0
      continue-on-error: true
    - name: Run CMake+vcpkg to build packages.
      id: build-packages
      uses: lukka/run-cmake@v10
      with:
        configurePreset: ${{ matrix.preset }}
        configurePresetAdditionalArgs: '[`-DOPENBLACK_WARNINGS_AS_ERRORS=ON`${{ matrix.triplet && format('', `-DVCPKG_TARGET_TRIPLET={0}`'', matrix.triplet) }}${{ matrix.additional_args && format('', {0}'', matrix.additional_args) }}]'
    - name: Run CMake+Ninja to build the code (Debug).
      uses: lukka/run-cmake@v10
      with:
        buildPreset: ${{ matrix.preset }}-debug
    - name: Run CMake+vcpkg to build the code (Release).
      uses: lukka/run-cmake@v10
      with:
        buildPreset: ${{ matrix.preset }}-release
env:
  GERALT_SECRET: ${{ secrets.GERALT }}
on:
  pull_request_target: null
  push:
    tags:
    - '*'
    branches:
    - master
    - ci-tests/**
